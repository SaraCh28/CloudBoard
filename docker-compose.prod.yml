# ─────────────────────────────────────────────────────────────────────────────
# CloudBoard – docker-compose.prod.yml  (Production overrides)
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ⚠️  Never commit real secrets. Inject via environment or secrets manager.
# ─────────────────────────────────────────────────────────────────────────────

services:
  backend:
    restart: always
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
      RATE_LIMIT_MAX: "120"
      # In production supply via CI/CD secrets:
      # JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # DATABASE_URL:   ${DATABASE_URL}
      # REDIS_URL:      ${REDIS_URL}
    volumes: []   # No source mounts in production
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 4
        --proxy-headers
        --forwarded-allow-ips '*'

  postgres:
    restart: always
    ports: []   # Do NOT expose DB port in production

  redis:
    restart: always
    ports: []   # Do NOT expose Redis port in production
    command: redis-server --requirepass "${REDIS_PASSWORD:-changeme}"
