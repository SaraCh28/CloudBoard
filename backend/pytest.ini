[pytest]
# ── Discovery ─────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Asyncio ───────────────────────────────────────────────────────
asyncio_mode = auto

# ── Output ───────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70

# ── Markers ───────────────────────────────────────────────────────
markers =
    unit: pure unit tests (no I/O)
    integration: tests that hit the in-process ASGI app with SQLite
    slow: tests that take >1s
